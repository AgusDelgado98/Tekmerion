[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tekmerion"
version = "0.8.0"
description = "Evidence-first analysis of Data, BI and AI job market signals"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Agustin Delgado" }
]
dependencies = [
    "Flask>=3.0.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.4.0",
]
dev = [
    "pytest>=8.0.0",
    "scikit-learn>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["analysis*", "app*"]
